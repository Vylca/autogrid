name: Build and release

# Every push to main is tested and built for Linux and macOS, and the macOS
# build is launched once in self-test mode. When package.json carries a version
# that has no release yet, the packages are published as that release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/AutoGrid-linux-x64.tar.gz
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - name: Check signature
        run: |
          ls release
          ditto -x -k release/AutoGrid-mac-arm64.zip smoke
          codesign --verify --deep --strict --verbose=2 smoke/AutoGrid.app
          codesign -dv smoke/AutoGrid.app 2>&1 | head -5
          lipo -archs smoke/AutoGrid.app/Contents/MacOS/AutoGrid
      - name: Self test on macOS
        run: |
          mkdir -p selftest/out selftest/userdata
          # macOS has no timeout command: start the app, then wait up to 3 minutes.
          AUTOGRID_SELFTEST="$PWD/selftest/out" AUTOGRID_USERDATA="$PWD/selftest/userdata" \
            smoke/AutoGrid.app/Contents/MacOS/AutoGrid > selftest/app.log 2>&1 &
          pid=$!
          for i in $(seq 1 180); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          tail -20 selftest/app.log || true
          ls -la selftest/out
          test "$(ls selftest/out/*.pdf | wc -l)" -ge 6
          test -f selftest/out/01-exams.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest
          path: selftest/out
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/AutoGrid-mac-*.zip
          if-no-files-found: error

  release:
    needs: [version, linux, mac]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoGrid ${{ needs.version.outputs.tag }}
          files: dist/*
          make_latest: true
          generate_release_notes: true
